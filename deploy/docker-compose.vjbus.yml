name: vjbus-app

services:
  be4-vjbus:
    build:
      context: ../backend/be4-vjbus
      dockerfile: Dockerfile
    container_name: vjbus-backend
    restart: unless-stopped
    ports:
      - "6104:6104"
    environment:
      - FLASK_ENV=production
      - BE_HOST=0.0.0.0
      - BE_PORT=6104
    env_file:
      - ../backend/be4-vjbus/.env
    volumes:
      - ../backend/be4-vjbus:/app
    networks:
      - vjbus-network

  fe4-vjbus:
    build:
      context: ../frontend/fe4-vjbus
      dockerfile: Dockerfile
    container_name: vjbus-frontend
    restart: unless-stopped
    ports:
      - "3104:3104"
    environment:
      - FLASK_ENV=production
      - FE_HOST=0.0.0.0
      - FE_PORT=3104
      - BE_SOCKET_URL=ws://103.248.208.119:3000   # production WS url
    env_file:
      - ../frontend/fe4-vjbus/.env
    volumes:
      - ../frontend/fe4-vjbus:/app
      - ../backend/be4-vjbus/database.db:/backend/be4-vjbus/database.db
    depends_on:
      - be4-vjbus
    networks:
      - vjbus-network

networks:
  vjbus-network:
    driver: bridge
name: vjbus-ci

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/be4-vjbus/**"
      - "frontend/fe4-vjbus/**"
      - "deploy/docker-compose.vjbus.yml"
      - ".github/workflows/vjbus-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/be4-vjbus/**"
      - "frontend/fe4-vjbus/**"
      - ".github/workflows/vjbus-ci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ─── BACKEND ─────────────────────────────────
      - name: Install backend dependencies
        working-directory: backend/be4-vjbus
        run: pip install eventlet flask flask_cors flask_socketio flake8

      - name: Lint backend
        working-directory: backend/be4-vjbus
        run: |
          flake8 . --max-line-length=120 \
                   --exclude=__pycache__,vjbus_env,venv \
                   --select=E9,F63,F7

      # ─── FRONTEND ────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend/fe4-vjbus
        run: pip install eventlet flask flask_cors flask_socketio flake8

      - name: Lint frontend
        working-directory: frontend/fe4-vjbus
        run: |
          flake8 . --max-line-length=120 \
                   --exclude=__pycache__,vjbus_env,venv \
                   --select=E9,F63,F7

  deploy-dev:
    needs: lint
    if: github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, dev-ai]
    environment: bus-development
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Environment Secrets
        run: |
          cat <<EOF > backend/be4-vjbus/.env
          all_routes=${{ secrets.ALL_ROUTES }}
          all_start_timings=${{ secrets.ALL_START_TIMINGS }}
          ALL_ROUTES=${{ secrets.ALL_ROUTES }}
          ALL_START_TIMINGS=${{ secrets.ALL_START_TIMINGS }}
          API_KEY=${{ secrets.API_KEY }}
          CLIENT_ID=${{ secrets.CLIENT_ID }}
          ORT=${{ secrets.ORT }}
          PORT=${{ secrets.PORT }}
          PUBLIC_APPS=${{ secrets.PUBLIC_APPS }}
          PYTHONUNBUFFERED=${{ secrets.PYTHONUNBUFFERED }}
          EOF
          cp backend/be4-vjbus/.env frontend/fe4-vjbus/.env

      - name: Deploy vjbus containers
        run: |
          docker compose -f deploy/docker-compose.vjbus.yml down
          docker compose -f deploy/docker-compose.vjbus.yml up -d --build
          docker image prune -f
          docker compose -f deploy/docker-compose.vjbus.yml ps

      - name: Trigger Dev URL
        run: |
          curl -I https://dev-bus.vjstartup.com || echo "Triggered Dev URL"

  deploy-prod:
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, gamma]
    environment: bus-production
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Environment Secrets
        run: |
          cat <<EOF > backend/be4-vjbus/.env
          all_routes=${{ secrets.ALL_ROUTES }}
          all_start_timings=${{ secrets.ALL_START_TIMINGS }}
          ALL_ROUTES=${{ secrets.ALL_ROUTES }}
          ALL_START_TIMINGS=${{ secrets.ALL_START_TIMINGS }}
          API_KEY=${{ secrets.API_KEY }}
          CLIENT_ID=${{ secrets.CLIENT_ID }}
          ORT=${{ secrets.ORT }}
          PORT=${{ secrets.PORT }}
          PUBLIC_APPS=${{ secrets.PUBLIC_APPS }}
          PYTHONUNBUFFERED=${{ secrets.PYTHONUNBUFFERED }}
          EOF
          cp backend/be4-vjbus/.env frontend/fe4-vjbus/.env

      - name: Deploy vjbus containers
        run: |
          docker compose -f deploy/docker-compose.vjbus.yml down
          docker compose -f deploy/docker-compose.vjbus.yml up -d --build
          docker image prune -f
          docker compose -f deploy/docker-compose.vjbus.yml ps

      - name: Trigger Prod URL
        run: |
          curl -I https://bus.vjstartup.com || echo "Triggered Prod URL"